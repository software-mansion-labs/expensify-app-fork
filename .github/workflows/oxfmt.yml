name: Oxfmt check

on:
  workflow_call:
    inputs:
      IS_DEPLOY_CANDIDATE:
        description: |
          Whether the push to main that triggered this run could result in a staging deploy.
          Deploy candidates get a per-commit concurrency group so their checks are never cancelled.
          Every other push to main shares one cancellable group, so a run that a newer merge has
          already superseded is dropped instead of finishing against a stale tip of main.
        type: boolean
        required: false
        # Defaults to the pre-existing behaviour (per-commit group, never cancelled) so that a caller
        # which does not set it cannot accidentally opt a deploy into being cancelled.
        default: true
  pull_request:
    types: [opened, synchronize]
    branches-ignore: [staging, production]
    paths: ['**.js', '**.ts', '**.tsx', '**.json', '**.mjs', '**.cjs', '**.yml', '**.yaml', '.oxfmtrc.json', 'config/.editorconfig', '.watchmanconfig', '.imgbotconfig']

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && inputs.IS_DEPLOY_CANDIDATE && format('{0}-{1}', github.ref, github.sha) || github.ref }}-oxfmt
  cancel-in-progress: true

jobs:
  oxfmt:
    name: Oxfmt check
    if: ${{ github.actor != 'OSBotify' || github.event_name == 'workflow_call' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@1c9394c220d293645707b625ba9d79685f093a8f # v1

      - name: Setup Node
        uses: ./.github/actions/composite/setupNode

      - name: Verify there's no Oxfmt diff
        run: |
          npm run fmt
          if ! git diff --name-only --exit-code; then
            # shellcheck disable=SC2016
            echo 'Error: Oxfmt diff detected! Please run `npm run fmt` and commit the changes.'
            exit 1
          fi
