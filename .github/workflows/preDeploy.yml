# Reminder: If this workflow's name changes, update the name in the dependent workflow at .github/workflows/failureNotifier.yml.
name: Process new code merged to main

on:
  push:
    branches: [main]
    paths-ignore: [docs/**, help/**, contributingGuides/**, jest/**, tests/**]

jobs:
  # main takes ~120 merges on a busy weekday and the checks below take ~10 minutes, so roughly two
  # thirds of these runs are superseded by a newer commit before they finish. A superseded run is safe
  # to cancel: the run that replaced it covers a superset of the same code. The one thing that is not
  # safe to cancel is a push that could deploy, because SHOULD_DEPLOY is derived from who pushed --
  # cancelling a deployer's run would hand off to a successor whose actor is not a deployer, and the
  # staging deploy would silently never happen.
  #
  # So decide "could this push deploy?" up front and let each check pick its concurrency group from
  # the answer. Only team membership is checked here, because it is stable for the lifetime of the
  # run. The deploy checklist lock is deliberately left in chooseDeployActions: it can flip while the
  # checks are running and must be read at the moment the deploy decision is actually made.
  isDeployCandidate:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      IS_DEPLOY_CANDIDATE: ${{ steps.isDeployCandidate.outputs.IS_DEPLOY_CANDIDATE }}

    steps:
      - name: Check whether this push could trigger a deploy
        id: isDeployCandidate
        run: |
          if [[ "$ACTOR" == 'OSBotify' ]]; then
            echo "IS_DEPLOY_CANDIDATE=false" >> "$GITHUB_OUTPUT"
          elif gh api "/orgs/Expensify/teams/mobile-deployers/memberships/$ACTOR" --silent; then
            echo "IS_DEPLOY_CANDIDATE=true" >> "$GITHUB_OUTPUT"
          else
            echo "IS_DEPLOY_CANDIDATE=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.OS_BOTIFY_TOKEN }}

  typecheck:
    needs: isDeployCandidate
    uses: ./.github/workflows/typecheck.yml
    with:
      IS_DEPLOY_CANDIDATE: ${{ fromJSON(needs.isDeployCandidate.outputs.IS_DEPLOY_CANDIDATE) }}

  lint:
    needs: isDeployCandidate
    uses: ./.github/workflows/lint.yml
    secrets: inherit
    with:
      IS_DEPLOY_CANDIDATE: ${{ fromJSON(needs.isDeployCandidate.outputs.IS_DEPLOY_CANDIDATE) }}

  oxfmt:
    needs: isDeployCandidate
    uses: ./.github/workflows/oxfmt.yml
    with:
      IS_DEPLOY_CANDIDATE: ${{ fromJSON(needs.isDeployCandidate.outputs.IS_DEPLOY_CANDIDATE) }}

  test:
    needs: isDeployCandidate
    uses: ./.github/workflows/test.yml
    secrets: inherit
    with:
      IS_DEPLOY_CANDIDATE: ${{ fromJSON(needs.isDeployCandidate.outputs.IS_DEPLOY_CANDIDATE) }}

  confirmPassingBuild:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [typecheck, lint, test]
    if: ${{ always() }}

    steps:
      - uses: useblacksmith/checkout@1c9394c220d293645707b625ba9d79685f093a8f # v1

      # Only a real `failure` fails this workflow. A run cancelled because a newer commit superseded
      # it must stay quiet, otherwise failureNotifier.yml would open a deploy blocker for every one of
      # them. `cancelled` and `skipped` therefore reach chooseDeployActions as a pass, which is why
      # the deploy decision below re-checks the results rather than relying on this job alone.
      - name: Exit failed workflow
        if: ${{ needs.typecheck.result == 'failure' || needs.lint.result == 'failure' || needs.test.result == 'failure' }}
        run: |
          echo "Checks failed, exiting ~ typecheck: ${{ needs.typecheck.result }}, lint: ${{ needs.lint.result }}, test: ${{ needs.test.result }}"
          exit 1

  chooseDeployActions:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [typecheck, lint, test, confirmPassingBuild]
    # Runs even when a check was cancelled, so that skipDeploy still comments on the merged PR. The
    # deploy itself is gated on CHECKS_PASSED below.
    if: ${{ always() && needs.confirmPassingBuild.result == 'success' }}
    outputs:
      MERGED_PR: ${{ steps.getMergedPullRequest.outputs.number }}
      SHOULD_DEPLOY: ${{ fromJSON(steps.shouldDeploy.outputs.SHOULD_DEPLOY) }}

    steps:
      - uses: useblacksmith/checkout@1c9394c220d293645707b625ba9d79685f093a8f # v1

      - name: Get merged pull request
        id: getMergedPullRequest
        uses: ./.github/actions/composite/getMergedPullRequest
        with:
          github_token: ${{ github.token }}

      - name: Check if deploy checklist is locked
        id: isDeployChecklistLocked
        uses: ./.github/actions/javascript/isDeployChecklistLocked
        with:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check if merged pull request should trigger a deploy
        id: shouldDeploy
        run: |
          # Never deploy off a run whose checks did not actually pass. A cancelled check means this
          # commit was superseded, so the run that superseded it is the one that should deploy.
          if [[ "$CHECKS_PASSED" != 'true' ]]; then
            echo "SHOULD_DEPLOY=false" >> "$GITHUB_OUTPUT"
          elif gh api /orgs/Expensify/teams/mobile-deployers/memberships/${{ github.actor }} --silent; then
            echo "SHOULD_DEPLOY=${{ (!fromJSON(steps.isDeployChecklistLocked.outputs.IS_LOCKED) && github.actor != 'OSBotify') }}" >> "$GITHUB_OUTPUT"
          else
            echo "SHOULD_DEPLOY=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          CHECKS_PASSED: ${{ needs.typecheck.result == 'success' && needs.lint.result == 'success' && needs.test.result == 'success' }}
          GITHUB_TOKEN: ${{ secrets.OS_BOTIFY_TOKEN }}

  skipDeploy:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: chooseDeployActions
    if: ${{ !fromJSON(needs.chooseDeployActions.outputs.SHOULD_DEPLOY) && github.actor != 'OSBotify' }}
    steps:
      - name: Comment on deferred PR
        run: |
          gh pr comment ${{ needs.chooseDeployActions.outputs.MERGED_PR }} --repo ${{ github.repository }} --body "$(cat <<'EOF'
          :hand: This PR was not deployed to staging yet because QA is ongoing. It will be automatically deployed to staging after the next production release.
          EOF
          )"
        env:
          GITHUB_TOKEN: ${{ secrets.OS_BOTIFY_TOKEN }}

  createNewVersion:
    needs: chooseDeployActions
    if: ${{ fromJSON(needs.chooseDeployActions.outputs.SHOULD_DEPLOY) }}
    uses: ./.github/workflows/createNewVersion.yml
    secrets: inherit

  updateStaging:
    needs: [chooseDeployActions, createNewVersion]
    uses: ./.github/workflows/updateProtectedBranch.yml
    secrets: inherit
    with:
      TARGET_BRANCH: staging
