# TEMPORARY POC - not for merge. Answers three questions about measuring the web bundle in CI:
#   1. Do two builds of one commit on the SAME runner agree? Raw must match to the byte; gzip carries a
#      wobble of a byte or two from rspack's re-export ordering, which the script reports as the floor.
#   2. Does a deliberate byte increase show up in the rendered comment section?
#   3. Do two builds of one commit on DIFFERENT runners agree? In the real design
#      the pull request build and the `main` build run on two independently provisioned runners, so this is
#      the floor that the comment actually inherits.
# Runs on a branch push, so it needs no pull request and posts nothing. Results land in the job summary.
name: Bundle size POC
# cspell:ignore hashlib pipefail

on:
  workflow_dispatch:
    inputs:
      ballast-bytes:
        description: Bytes of near-incompressible data to inject on the initial path
        type: string
        default: '200000'
  push:
    branches:
      - 'poc/bundle-size**'

permissions:
  contents: read

jobs:
  bundle-size-poc:
    name: Bundle size POC
    runs-on: ${{ github.repository_owner == 'Expensify' && 'blacksmith-8vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      BALLAST_BYTES: ${{ inputs.ballast-bytes || '200000' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: ./.github/actions/composite/setupNode

      # No SENTRY_AUTH_TOKEN: the source map upload 401s and the build still exits 0, which is what a
      # secret-less job and a fork pull request both get.
      - name: Build web (first build of this commit)
        run: npm run build

      # `bun` is a devDependency, so it is only on PATH inside `npm run` scripts. Call it by path.
      - name: Measure first build
        run: ./node_modules/.bin/bun ./scripts/bundleSize.ts --out base.json

      # Kept so the residual-difference step can say WHAT changed, not only by how much. `vendors` is the
      # only chunk that has ever differed between two builds of one commit here.
      - name: Keep the first build's vendors chunk
        run: cp dist/vendors-*.bundle.js vendors-first.js

      - name: Build web (second build of the same commit)
        run: npm run build

      - name: Measure second build
        run: ./node_modules/.bin/bun ./scripts/bundleSize.ts --out rebuild.json

      - name: Keep the second build's vendors chunk
        run: cp dist/vendors-*.bundle.js vendors-second.js

      # The floor question. The first build runs on a cold rspack cache and the second on a warm one, so
      # this also tells us whether the cache changes the emitted bytes.
      - name: Question 1 - do two builds on one runner agree?
        id: floor
        continue-on-error: true
        run: |
          # `| tee` returns tee's exit code, so without pipefail a failed check reports success.
          set -o pipefail
          status=0
          ./node_modules/.bin/bun ./scripts/bundleSize.ts --assert-same base.json rebuild.json 2>&1 | tee floor.txt || status=$?
          {
            echo '## Question 1: do two builds on one runner agree?'
            echo
            echo '```'
            cat floor.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Names what still differs. Both per-build identifiers - the Sentry debug id and the source map hash -
      # are already held constant when measuring, so they are masked here too: anything this step prints is a
      # cause the measurement script does not mask, and is therefore real emitted content.
      - name: Diagnose the residual difference
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import re
          def load(path):
              data = open(path, 'rb').read()
              debug = re.search(rb'_sentryDebugIds\[[A-Za-z_$0-9]+\]="([0-9a-f-]{36})"', data)
              if debug:
                  data = data.replace(debug.group(1), b'0' * 36)
              return re.sub(
                  rb'(sourceMappingURL=\S*?-)([0-9a-f]{8,})(\.bundle\.js\.map)',
                  lambda m: m.group(1) + b'0' * len(m.group(2)) + m.group(3),
                  data,
                  count=1,
              )
          a, b = load('vendors-first.js'), load('vendors-second.js')
          print('## Residual difference in `vendors`, with the per-build identifiers masked')
          print()
          print('| | value |')
          print('|---|---|')
          print('| length, first build | %d B |' % len(a))
          print('| length, second build | %d B |' % len(b))
          if a == b:
              print()
              print('The two chunks are byte-identical once the per-build identifiers are masked, so nothing else varies.')
              raise SystemExit(0)
          offsets = [i for i in range(min(len(a), len(b))) if a[i] != b[i]]
          print('| differing byte positions | %d |' % len(offsets))
          print('| first differing offset | %d |' % offsets[0])
          print()
          for name, data in (('first', a), ('second', b)):
              lo = max(0, offsets[0] - 160)
              print('%s build, offset %d:' % (name, offsets[0]))
              print()
              print('```')
              print(data[lo:offsets[0] + 160].decode('utf8', 'replace'))
              print('```')
              print()
          PY

      - name: Inject ballast on the initial path
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, os
          target = int(os.environ['BALLAST_BYTES'])
          buf, seed = b'', b'bundle-size-poc'
          while len(buf) < target:
              seed = hashlib.sha512(seed).digest()
              buf += seed
          payload = base64.b64encode(buf[:target]).decode()
          io.open('src/libs/pocBallast.ts', 'w', encoding='utf-8').write(
              '/* eslint-disable */\n'
              '// TEMPORARY POC BALLAST. Assigns to globalThis so nothing can tree-shake it away.\n'
              "const POC_BALLAST = '%s';\n"
              "(globalThis as unknown as Record<string, string>).__POC_BALLAST__ = POC_BALLAST;\n"
              'export default POC_BALLAST;\n' % payload
          )
          app = io.open('src/App.tsx', encoding='utf-8').read()
          anchor = "import '../wdyr';"
          assert app.count(anchor) == 1, 'anchor import not found in src/App.tsx'
          io.open('src/App.tsx', 'w', encoding='utf-8').write(
              app.replace(anchor, anchor + "\nimport './libs/pocBallast';")
          )
          print('injected %d bytes of payload' % target)
          PY

      - name: Build web (with ballast)
        run: npm run build

      - name: Measure build with ballast
        run: ./node_modules/.bin/bun ./scripts/bundleSize.ts --out head.json --sha "${{ github.sha }}-with-ballast"

      - name: Question 2 - does the comment section show the increase?
        run: |
          {
            echo '## Question 2: does the rendered section show the increase?'
            echo
            echo "Injected ${BALLAST_BYTES} B of near-incompressible data into a module imported by \`src/App.tsx\`."
            echo
            ./node_modules/.bin/bun ./scripts/bundleSize.ts --compare base.json head.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore the tree
        if: always()
        run: git checkout src/App.tsx && rm -f src/libs/pocBallast.ts

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: bundle-size-poc
          path: |
            base.json
            rebuild.json
            head.json
            floor.txt

      - name: Verdict
        run: |
          if [ "${{ steps.floor.outcome }}" != 'success' ]; then
            echo "::error::Two CI builds of one commit disagree beyond the documented floor. See the job summary: every delta this tooling reports carries an unknown floor until this is explained."
            exit 1
          fi
          echo "::notice::Raw bytes are reproducible across builds, so a raw delta means a real change."

  # Question 3. Two independently provisioned runners build the same commit once each. Nothing is shared
  # between them, which is exactly the relationship between a pull request build and a `main` build.
  cross-runner-build:
    name: Cross-runner build ${{ matrix.runner }}
    runs-on: ${{ github.repository_owner == 'Expensify' && 'blacksmith-8vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [a, b]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: ./.github/actions/composite/setupNode

      - name: Build web
        run: npm run build

      - name: Measure
        run: ./node_modules/.bin/bun ./scripts/bundleSize.ts --out "runner-${{ matrix.runner }}.json"

      - name: Upload measurement
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: bundle-size-runner-${{ matrix.runner }}
          path: runner-${{ matrix.runner }}.json

  cross-runner-floor:
    name: Question 3 - is the floor 0 B across runners?
    needs: cross-runner-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: ./.github/actions/composite/setupNode

      - name: Download runner a measurement
        uses: actions/download-artifact@448e3f862ab3ef47aa50ff917776823c9946035b
        with:
          name: bundle-size-runner-a

      - name: Download runner b measurement
        uses: actions/download-artifact@448e3f862ab3ef47aa50ff917776823c9946035b
        with:
          name: bundle-size-runner-b

      - name: Compare
        run: |
          set -o pipefail
          status=0
          ./node_modules/.bin/bun ./scripts/bundleSize.ts --assert-same runner-a.json runner-b.json 2>&1 | tee cross.txt || status=$?
          {
            echo '## Question 3: is the floor 0 B across two runners?'
            echo
            echo '```'
            cat cross.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::error::Two runners building one commit disagree. Every delta the comment reports inherits this difference as its floor."
          fi
          exit "$status"
