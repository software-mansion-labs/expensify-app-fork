# Measures the web bundle a pull request emits, and every measurement `main` needs to be compared against.
#
# This workflow only measures and uploads. It never comments: a `pull_request` run from a fork holds a
# read-only token, and giving this job a write token would mean running a fork's build with that token in
# scope. `bundleSizeComment.yml` follows this workflow and does the posting, from the default branch's code.
#
# Artifact upload works from a fork run because artifacts use the runner's own runtime token rather than
# `GITHUB_TOKEN`, which is what makes the split possible at all.
name: Bundle size
# cspell:ignore argjson

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Everything that can change what `npm run build` emits: app sources, the bundler configuration, the
    # assets it embeds, the dependency tree, and the patches applied to it. The measurement tooling itself
    # is included so a change to how bytes are counted re-counts them.
    paths:
      - 'src/**'
      - 'config/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'patches/**'
      - 'scripts/bundleSize.ts'
      - '.github/workflows/bundleSize.yml'
  push:
    # A pull request is compared against the branch it merges into, so every branch that is a base for pull
    # requests has to measure its own commits. `main` is that branch. `poc/bundle-size**` is TEMPORARY: it
    # is the base of the pull requests that prove this out on a fork. Remove that entry before this ships.
    branches: [main, 'poc/bundle-size**']
    paths:
      - 'src/**'
      - 'config/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'patches/**'
      - 'scripts/bundleSize.ts'
      - '.github/workflows/bundleSize.yml'

permissions:
  contents: read

# One measurement per pull request head is enough, so a superseded push is cancelled. A `main` commit is
# never cancelled: its measurement is the baseline every later pull request is compared against, and the
# grouping key is the commit itself so two `main` commits never contend.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  measure:
    name: Measure
    runs-on: ${{ github.repository_owner == 'Expensify' && 'blacksmith-8vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 60
    # Stated at the job rather than inherited, because the POC job below deliberately holds more. This is the
    # job that builds a pull request's code, and it can do nothing but read.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: ./.github/actions/composite/setupNode

      # Exactly the command `buildWeb.yml` runs for a deploy, with no added flags: any bundler configuration
      # change risks measuring a bundle that is not the bundle that ships. No `SENTRY_AUTH_TOKEN` is passed,
      # so the source map upload 401s and the build still exits 0 - the same path a fork run takes.
      - name: Build web
        run: npm run build

      # For a `pull_request` run, `actions/checkout` checks out the merge ref, so `git rev-parse HEAD` is the
      # ephemeral merge commit. The head SHA is what the comment has to be keyed to.
      - name: Measure
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node ./scripts/bundleSize.ts --out bundle-size.json --sha "$HEAD_SHA"

      # The follower cannot read the pull request number from the `workflow_run` payload for a fork run, so
      # it travels in the artifact. `base.sha` is the base branch tip this head was compared against, which
      # is where the follower starts its merge-base lookup.
      - name: Record what was measured
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
        run: |
          jq -n \
            --argjson prNumber "${PR_NUMBER:-null}" \
            --arg headSha "$HEAD_SHA" \
            --arg baseSha "$BASE_SHA" \
            --arg baseRef "$BASE_REF" \
            --arg event "$GITHUB_EVENT_NAME" \
            '{prNumber: $prNumber, headSha: $headSha, baseSha: $baseSha, baseRef: $baseRef, event: $event}' \
            > bundle-size-meta.json
          cat bundle-size-meta.json

      # `main` measurements are baselines for every pull request opened afterwards, so they are kept for the
      # maximum default retention. A pull request's own measurement is read once, minutes later.
      - name: Upload measurement
        # v6
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: bundle-size
          retention-days: ${{ github.event_name == 'push' && 90 || 7 }}
          path: |
            bundle-size.json
            bundle-size-meta.json

      - name: Summarize
        run: |
          {
            echo '## Bundle size measured'
            echo
            echo '```json'
            cat bundle-size.json | jq 'del(.chunks)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # TEMPORARY POC JOB - delete before this ships, along with the `poc/bundle-size**` push trigger above.
  #
  # `bundleSizeComment.yml` is the real poster, and it cannot be tested from a feature branch: `workflow_run`
  # only fires for the copy of a workflow file on the repository's default branch. This job posts the same
  # comment through the same composite action, from the branch, so the comment can be proven without
  # changing where a repository's default branch points.
  #
  # It is not the shipping design, and must not become it. It holds `pull-requests: write` in the same run
  # that built the pull request's code, which is exactly what the two-workflow split exists to avoid. That is
  # only tolerable here because of the `head.repo.full_name == github.repository` guard: a pull request from
  # a fork skips this job entirely and gets nothing from it, so no fork's code ever runs with the write
  # token. On a fork-internal pull request the code being built is already the repository's own.
  poc-comment:
    name: POC - post the comment from the branch
    needs: measure
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ github.repository_owner == 'Expensify' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The measurement is in this run's own artifact, uploaded by `measure`. The BASELINE still comes from
      # an earlier run, so the cross-run artifact download that the real follower depends on is exercised
      # here too. What is left untested is only whether `workflow_run` fires and hands over the right run id.
      - name: Post the bundle size comment
        uses: ./.github/actions/composite/postBundleSizeComment
        with:
          measurement-run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
